name: Deploy frontend to Azure Static Web Apps

# Manual deployment only.
# The original Azure Static Web Apps instance has been decommissioned, so this
# workflow no longer runs on push or pull requests (which previously also
# created preview environments). It is kept as a reference for redeploying the
# frontend with a new Static Web App and deployment token secret.
# Build validation runs in ci.yml.

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API base URL baked into the frontend build"
        required: true
        type: string

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Install OIDC client
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get GitHub ID token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const actionsCore = require('@actions/core')
            return await actionsCore.getIDToken()
          result-encoding: string

      - name: Build and deploy frontend
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_COAST_018EC2603 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "apps/web"
          api_location: ""
          output_location: "dist"
          github_id_token: ${{ steps.idtoken.outputs.result }}
