name: Deploy API to Azure App Service

# Manual deployment only.
# The original Azure App Service instance has been decommissioned, so this
# workflow no longer runs automatically. It is kept as a reference for
# redeploying the API with a new App Service and publish profile secret.
# Build and test validation runs in ci.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  API_PROJECT: "apps/api/AssetPortfolioOps.Api.csproj"
  PUBLISH_DIR: "api-publish"

jobs:
  build-test-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish API
        run: dotnet publish $env:API_PROJECT --configuration Release --output $env:PUBLISH_DIR --no-build

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "api-asset-portfolio-ops"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
